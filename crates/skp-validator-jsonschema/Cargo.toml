[package]
name = "skp-validator-jsonschema"
description = "JSON Schema generation integration for skp-validator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skp-validator-core = { workspace = true, features = ["serde"] }
schemars = "1.2.0"
schemars_derive = "1.2.0"
