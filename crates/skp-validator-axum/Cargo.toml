[package]
name = "skp-validator-axum"
description = "Axum integration for skp-validator - seamless validation in Axum web applications"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
skp-validator-core = { workspace = true, features = ["serde"] }
axum = { version = "0.8.8", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
http = "1.4.0"
bytes = "1.11.0"
mime = "0.3.17"
async-trait = "0.1.89"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
