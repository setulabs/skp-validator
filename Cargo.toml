[workspace]
resolver = "2"
members = [
    "crates/skp-validator",
    "crates/skp-validator-core",
    "crates/skp-validator-rules",
    "crates/skp-validator-derive",
    "crates/skp-validator-axum",
    "crates/skp-validator-jsonschema",
    "crates/skp-validator-actix",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sachin Kumar Pandey"]
license = "MIT"
repository = "https://github.com/sachin/skp-validator"
homepage = "https://github.com/sachin/skp-validator"
documentation = "https://docs.rs/skp-validator"
keywords = ["validation", "validator", "derive", "serde", "json"]
categories = [
    "development-tools",
    "data-structures",
    "web-programming",
    "algorithms",
    "security",
]

[workspace.dependencies]
# Internal crates
skp-validator = { path = "crates/skp-validator", version = "0.1.0" }
skp-validator-core = { path = "crates/skp-validator-core", version = "0.1.0" }
skp-validator-rules = { path = "crates/skp-validator-rules", version = "0.1.0" }
skp-validator-derive = { path = "crates/skp-validator-derive", version = "0.1.0" }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }

# Error handling
thiserror = "2.0.17"

# Utilities
once_cell = "1.21.3"
regex = "1.12.2"
chrono = { version = "0.4.43", default-features = false, features = [
    "std",
    "clock",
] }

# Optional validators
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }
phonenumber = "0.3.9"

# Proc-macro
proc-macro2 = "1.0.105"
quote = "1.0.43"
syn = { version = "2.0.114", features = ["full", "extra-traits", "parsing"] }

# Framework adapters
axum = "0.8.8"
actix-web = "4.12.1"

# i18n
fluent = "0.17.0"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"

# Testing
tokio = { version = "1.49.0", features = ["full"] }
