[workspace]
resolver = "2"
members = [
    "crates/skp-validator",
    "crates/skp-validator-core",
    "crates/skp-validator-rules",
    "crates/skp-validator-derive",
    "crates/skp-validator-axum",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Sachin Kumar Pandey"]
license = "MIT"
repository = "https://github.com/sachin/skp-validator"
homepage = "https://github.com/sachin/skp-validator"
documentation = "https://docs.rs/skp-validator"
keywords = ["validation", "validator", "derive", "serde", "json"]
categories = ["development-tools", "data-structures"]

[workspace.dependencies]
# Internal crates
skp-validator = { path = "crates/skp-validator", version = "2.0.0" }
skp-validator-core = { path = "crates/skp-validator-core", version = "2.0.0" }
skp-validator-rules = { path = "crates/skp-validator-rules", version = "2.0.0" }
skp-validator-derive = { path = "crates/skp-validator-derive", version = "2.0.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# Error handling
thiserror = "1.0"

# Utilities
once_cell = "1.19"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }

# Optional validators
url = "2.5"
uuid = { version = "1.7", features = ["v4"] }
phonenumber = "0.3"

# Proc-macro
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }

# Framework adapters
axum = "0.8.8"
actix-web = "4.4"

# i18n
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = "0.9"

# Testing
tokio = { version = "1.35", features = ["full"] }
